services:
  postgresql:
    image: postgres:17
    container_name: shortner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shortner
      POSTGRES_PASSWORD: shortner
      POSTGRES_DB: shortner
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: shortner-redis
    restart: unless-stopped
    ports:
      - "6380:6379"

volumes:
  pgdata:
